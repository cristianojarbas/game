<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cristiano Jarbas Real Estate Tycoon (Game Board)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/phosphor-icons"></script>
  <style>
    :root {
      --color-primary: #1E40FF;
      --color-secondary: #C8102E;
      --color-accent: #FFC300;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1117;
      color: #f3f4f6;
    }
    .bg-primary { background-color: var(--color-primary); }
    .text-primary { color: var(--color-primary); }
    .bg-secondary { background-color: var(--color-secondary); }
    .text-secondary { color: var(--color-secondary); }
    .bg-accent { background-color: var(--color-accent); }
    .text-accent { color: var(--color-accent); }

    /* Board and spaces styling */
    .game-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 10px;
      max-width: 800px;
      aspect-ratio: 1 / 1;
      margin: 20px auto;
      border: 10px solid var(--color-secondary);
      border-radius: 20px;
      background-color: #0d1117;
    }
    .board-space {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      text-align: center;
      font-weight: 600;
      color: white;
      position: relative;
      min-height: 100px;
    }
    .board-space.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .board-space:not(.disabled):hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }
    .zone-1 { background-color: var(--color-primary); }
    .zone-2 { background-color: var(--color-secondary); }
    .zone-3 { background-color: #334155; }
    .space-start { grid-area: 5 / 5 / 6 / 6; background-color: #10B981; }

    /* grid positions for other spaces should be defined here — replicate your original */
    .center-display {
      grid-area: 2 / 2 / 5 / 5;
      background-color: #2c2f33;
      border-radius:12px;
      padding:20px;
      overflow-y:auto;
    }
    .center-content {
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }
    .stage-active {
      box-shadow: 0 0 15px 5px var(--color-accent);
      border:3px solid var(--color-accent);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-gray-800 shadow-lg py-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
      <div class="flex items-center">
        <img src="path/to/your-logo.png" alt="Cristiano Jarbas Inc Logo" class="h-12 w-auto mr-4">
        <h1 class="text-3xl font-black text-secondary flex items-center">
          <i class="ph ph-house-line mr-2 text-primary"></i>
          Cristiano Jarbas Real Estate Tycoon
        </h1>
      </div>
      <div>
        <img src="path/to/your-photo.jpg" alt="Cristiano Jarbas" class="h-12 w-12 rounded-full border-2 border-accent">
      </div>
    </div>
  </header>

  <main class="flex-grow p-4">
    <div id="game-status" class="text-center mb-6 text-lg font-semibold text-gray-300">
      Current Market: <span id="market-display" class="text-accent">...</span> |
      Max Budget: <span id="budget-display" class="text-accent">...</span>
    </div>

    <div class="game-board" id="game-board">
      <div id="space-start" class="board-space space-start" onclick="if(!this.classList.contains('disabled')) handleSpaceClick('start')">
        <i class="ph ph-flag-checkered text-4xl mb-1"></i>
        START / Choose Market
      </div>
      <div id="space-1-1" class="board-space zone-1 disabled" onclick="if(!this.classList.contains('disabled')) handleSpaceClick('1-1')">
        <i class="ph ph-money text-3xl mb-1"></i>
        Income & Debts
      </div>
      <!-- … continue your other spaces with correct ids, classes, onclick handlers … -->
      <div class="center-display">
        <div id="center-content" class="center-content text-center">
          <h2 class="text-3xl font-black text-secondary mb-4">
            Welcome to Cristiano Jarbas Real Estate Tycoon!
          </h2>
          <p class="text-gray-300">
            Click the <strong>START</strong> space to begin your journey to homeownership.
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal and logic (as before) -->
  <!-- ... (keep your JS logic) ... -->

</body>
</html>
