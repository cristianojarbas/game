<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristiano Jarbas Tycoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/phosphor-icons"></script>
    <style>
        :root {
            --color-primary: #1E40FF; /* Blue */
            --color-secondary: #C8102E; /* Red */
            --color-accent: #FFC300; /* Gold */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #f3f4f6;
        }
        
        /* Utility Classes */
        .btn-primary {
            @apply px-6 py-3 rounded-xl font-bold transition duration-200 shadow-lg text-white w-full;
            background-color: var(--color-secondary);
        }
        .btn-primary:hover { opacity: 0.9; }

        /* MODIFICAÇÃO CRÍTICA: Cor do input para PRETO */
        .input-field {
            /* Definido background e forçando text-black */
            @apply w-full p-2 bg-white text-black border border-gray-600 rounded mb-2 focus:border-accent focus:outline-none transition;
            /* Se for necessário um reforço maior (pode ser problema de herança de cor do navegador) */
            color: black !important; 
        }
        .label-text {
            @apply block text-sm font-bold text-gray-400 mb-1 text-left;
        }

        /* --- GAME BOARD GRID --- */
        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            max-width: 800px;
            aspect-ratio: 1 / 1;
            margin: 20px auto;
            border: 10px solid var(--color-secondary);
            border-radius: 20px;
            background-color: #0d1117;
        }

        .board-space {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            text-align: center;
            font-weight: 600;
            color: white;
            font-size: 0.8rem;
            position: relative;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .board-space { font-size: 0.6rem; }
            .board-space i { font-size: 1.2rem; }
        }

        .board-space.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(100%);
        }
        .board-space:not(.disabled):hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        /* Active Stage Highlight */
        .stage-active {
            box-shadow: 0 0 20px var(--color-accent);
            border: 2px solid var(--color-accent);
            z-index: 20;
            transform: scale(1.05);
        }

        /* Colors by Zone */
        .zone-1 { background-color: var(--color-primary); } /* Finance */
        .zone-2 { background-color: var(--color-secondary); } /* Hunting */
        .zone-3 { background-color: #475569; } /* Closing */
        .space-start { background-color: #10B981; } /* Start */

        /* Grid Positioning (Perimeter Walk) */
        .space-start { grid-area: 5 / 5 / 6 / 6; }
        .space-1-1 	{ grid-area: 5 / 4 / 6 / 5; }
        .space-1-2 	{ grid-area: 5 / 3 / 6 / 4; }
        .space-1-3 	{ grid-area: 5 / 2 / 6 / 3; }
        .space-1-4 	{ grid-area: 5 / 1 / 6 / 2; }
        .space-2-1 	{ grid-area: 4 / 1 / 5 / 2; }
        .space-2-2 	{ grid-area: 3 / 1 / 4 / 2; }
        .space-2-3 	{ grid-area: 2 / 1 / 3 / 2; }
        .space-2-4 	{ grid-area: 1 / 1 / 2 / 2; }
        .space-3-1 	{ grid-area: 1 / 2 / 2 / 3; }
        .space-3-2 	{ grid-area: 1 / 3 / 2 / 4; }
        .space-3-3 	{ grid-area: 1 / 4 / 2 / 5; }
        .space-3-4 	{ grid-area: 1 / 5 / 2 / 6; }

        /* Center Display */
        .center-display {
            grid-area: 2 / 2 / 5 / 5;
            background-color: #1f2937;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #374151;
        }

        .center-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-gray-900 shadow-lg py-4 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-2xl md:text-3xl font-black text-white flex items-center justify-center gap-2">
                <img src="https://exemplo.com/sua-foto.jpg" onerror="this.onerror=null; this.src='https://via.placeholder.com/32'" alt="Foto de Perfil" class="h-8 w-8 rounded-full object-cover border-2 border-accent mr-2">
                <span>Cristiano Jarbas <span class="text-primary">Tycoon</span></span>
            </h1>
        </div>
    </header>

    <main class="flex-grow p-4">
        <div id="game-status" class="text-center mb-4 text-sm md:text-lg font-semibold text-gray-400">
            Mercado: <span id="market-display" class="text-white">...</span> | Orçamento Máximo: <span id="budget-display" class="text-white">...</span>
        </div>

        <div class="game-board">
            <div id="space-start" class="board-space space-start" onclick="handleSpaceClick('start')">
                <i class="ph ph-flag-checkered text-3xl mb-1"></i>
                INICIAR
            </div>

            <div id="space-1-1" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-1')">
                <i class="ph ph-money text-2xl mb-1"></i> Renda
            </div>
            <div id="space-1-2" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-2')">
                <i class="ph ph-piggy-bank text-2xl mb-1"></i> Dívidas
            </div>
            <div id="space-1-3" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-3')">
                <i class="ph ph-percent text-2xl mb-1"></i> Entrada
            </div>
            <div id="space-1-4" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-4')">
                <i class="ph ph-file-text text-2xl mb-1"></i> Pré-Aprovação
            </div>

            <div id="space-2-1" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-1')">
                <i class="ph ph-magnifying-glass text-2xl mb-1"></i> Buscar
            </div>
            <div id="space-2-2" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-2')">
                <i class="ph ph-chart-bar text-2xl mb-1"></i> Comparar
            </div>
            <div id="space-2-3" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-3')">
                <i class="ph ph-house-line text-2xl mb-1"></i> Selecionar
            </div>
            <div id="space-2-4" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-4')">
                <i class="ph ph-pencil-line text-2xl mb-1"></i> Oferta
            </div>

            <div id="space-3-1" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-1')">
                <i class="ph ph-toolbox text-2xl mb-1"></i> Inspeção
            </div>
            <div id="space-3-2" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-2')">
                <i class="ph ph-bank text-2xl mb-1"></i> Avaliação
            </div>
            <div id="space-3-3" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-3')">
                <i class="ph ph-file-pdf text-2xl mb-1"></i> Fechamento
            </div>
            <div id="space-3-4" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-4')">
                <i class="ph ph-key text-2xl mb-1"></i> Chaves!
            </div>

            <div class="center-display">
                <div id="center-content" class="center-content">
                    </div>
            </div>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center p-4 z-50">
        <div class="bg-white text-gray-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gray-100 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold flex items-center"></h3>
                <button onclick="hideModal()" class="text-gray-500 hover:text-red-500">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6"></div>
            <div class="px-6 py-4 bg-gray-50 flex justify-end">
                <button onclick="hideModal()" class="btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script type="module">
        // --- CONSTANTES E CONFIGURAÇÃO ---
        const MARKET_SCENARIOS = {
            easy: {
                name: "Subúrbio Inicial", priceRange: [250000, 350000], taxRate: 0.0085, interestRate: 0.0625,
                startSavings: 30000, startIncome: 8000, startDebts: { cartao: 500, carro: 300, estudo: 100 }
            },
            medium: {
                name: "Metrópole Quente", priceRange: [400000, 650000], taxRate: 0.0120, interestRate: 0.0650,
                startSavings: 70000, startIncome: 14000, startDebts: { cartao: 1000, carro: 500, estudo: 250 }
            },
            hard: {
                name: "Luxo Litorâneo", priceRange: [800000, 1200000], taxRate: 0.0065, interestRate: 0.0675,
                startSavings: 150000, startIncome: 25000, startDebts: { cartao: 1500, carro: 700, estudo: 500 }
            }
        };

        const stageOrder = ['start', '1-1', '1-2', '1-3', '1-4', '2-1', '2-2', '2-3', '2-4', '3-1', '3-2', '3-3', '3-4', 'complete'];
        const PMI_RATE = 0.005;
        const INSURANCE_COST = 1800;
        const MAX_DTI = 0.43; // Debt-to-Income Ratio

        let gameState = {
            stage: 'start',
            market: null,
            income: 0,
            savings: 0,
            currentDebts: {},
            downPaymentPct: 0.20,
            maxOfferPrice: 0,
            property: null,
            offer: {},
            inspectionIssues: null,
            appraisalValue: 0
        };

        let currentListings = [];

        // --- UTILS ---
        // Formato para Real Brasileiro (R$)
        const formatCurrency = (amt) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(amt);
        const formatPercent = (val) => (val * 100).toFixed(1) + '%';
        const roundToNearest = (val, n) => Math.round(val / n) * n;

        // --- CORE FUNCTIONS ---
        const getNextStage = (current) => {
            const idx = stageOrder.indexOf(current);
            return (idx !== -1 && idx < stageOrder.length - 1) ? stageOrder[idx + 1] : 'complete';
        };

        const saveGameState = (updates) => {
            gameState = { ...gameState, ...updates };
            updateUI();
        };

        const updateUI = () => {
            const mkt = gameState.market ? MARKET_SCENARIOS[gameState.market].name : 'N/A';
            const budget = gameState.maxOfferPrice > 0 ? formatCurrency(gameState.maxOfferPrice) : 'N/A';
            document.getElementById('market-display').innerText = mkt;
            document.getElementById('budget-display').innerText = budget;

            document.querySelectorAll('.board-space').forEach(el => {
                el.classList.remove('stage-active');
                el.classList.add('disabled');
            });

            if (gameState.stage === 'start') {
                document.getElementById('space-start').classList.remove('disabled');
                document.getElementById('space-start').classList.add('stage-active');
            } else if (gameState.stage !== 'complete') {
                const currentId = `space-${gameState.stage}`;
                const nextStage = getNextStage(gameState.stage);
                const nextId = `space-${nextStage}`;

                const currEl = document.getElementById(currentId);
                if(currEl) currEl.classList.remove('disabled');

                const nextEl = document.getElementById(nextId);
                if(nextEl) {
                    nextEl.classList.remove('disabled');
                    nextEl.classList.add('stage-active');
                }
            }
        };

        window.handleSpaceClick = (id) => {
            // Lógica para capturar e salvar os dados ANTES de mudar de tela
            if (id === getNextStage(gameState.stage)) {
                // Captura inputs da Etapa 1-1 (Renda)
                if (gameState.stage === '1-1') {
                    // CRÍTICO: Capturar o valor do input (string) e converter para número
                    const newIncome = parseFloat(document.getElementById('input-income').value);
                    const newSavings = parseFloat(document.getElementById('input-savings').value);
                    saveGameState({ income: newIncome || 0, savings: newSavings || 0 }); 
                }
                // Captura inputs da Etapa 1-2 (Dívidas)
                if (gameState.stage === '1-2') {
                    let newDebts = {};
                    document.querySelectorAll('.debt-input').forEach(input => {
                        // CRÍTICO: Capturar o valor do input (string) e converter para número
                        newDebts[input.name] = parseFloat(input.value) || 0;
                    });
                    saveGameState({ currentDebts: newDebts });
                }
                
                // Agora que os dados estão salvos, avançamos
                saveGameState({ stage: id });
            }

            if (!document.getElementById(`space-${id}`).classList.contains('disabled')) {
                renderCenterContent(id);
            }
        };

        window.advanceStage = (updates = {}) => {
            const next = getNextStage(gameState.stage);
            saveGameState({ stage: next, ...updates });
            renderCenterContent(next);
        };

        window.resetGame = () => {
            location.reload();
        };

        // --- RENDER FUNCTIONS ---
        const renderCenterContent = (id) => {
            const content = document.getElementById('center-content');
            let html = '';

            switch(id) {
                case 'start':
                    html = `
                        <div class="mb-6">
                            <img src="https://exemplo.com/seu-logo.png" onerror="this.onerror=null; this.src='https://via.placeholder.com/96x96?text=LOGO'" alt="Logo da Imobiliária" class="w-24 h-24 object-contain mx-auto">
                        </div>
                        <h2 class="text-3xl font-black text-secondary mb-4">Selecione o Mercado</h2>
                        <div class="grid gap-4 w-full">
                            ${Object.entries(MARKET_SCENARIOS).map(([k, v]) => `
                                <button onclick="selectMarket('${k}')" class="bg-gray-800 p-4 rounded hover:bg-gray-700 border border-gray-600 text-left">
                                    <div class="font-bold text-accent text-lg">${v.name}</div>
                                    <div class="text-sm text-gray-400">Preço Base: ${formatCurrency(v.priceRange[0])}</div>
                                </button>
                            `).join('')}
                        </div>
                    `;
                    break;
                case '1-1': // Renda e Poupança (EDITÁVEL)
                    html = `
                        <h3 class="text-xl font-bold mb-4">Auditoria Financeira</h3>
                        <p class="text-sm text-gray-400 mb-4">Ajuste sua renda mensal e poupança se necessário:</p>
                        
                        <div class="w-full">
                            <label class="label-text">Renda Mensal (R$)</label>
                            <input type="number" id="input-income" class="input-field" value="${gameState.income}">
                            
                            <label class="label-text mt-3">Poupança Total (R$)</label>
                            <input type="number" id="input-savings" class="input-field" value="${gameState.savings}">
                        </div>

                        <button onclick="handleSpaceClick('1-2')" class="btn-primary mt-4">Salvar e Próximo</button>
                    `;
                    break;
                case '1-2': // Dívidas (EDITÁVEL)
                    const debtTotal = Object.values(gameState.currentDebts).reduce((a,b)=>a+b,0);
                    html = `
                        <h3 class="text-xl font-bold mb-4">Gestão de Dívidas</h3>
                           <p class="text-sm text-gray-400 mb-4">Edite seus pagamentos mensais de dívidas:</p>
                        
                        <div class="space-y-2 w-full mb-4">
                            ${Object.entries(gameState.currentDebts).map(([k, v]) => `
                                <div>
                                    <label class="label-text capitalize">${k}</label>
                                    <input type="number" class="input-field debt-input" name="${k}" value="${v}">
                                </div>
                            `).join('')}
                        </div>
                           <div class="text-right text-sm text-accent font-bold mb-4">Total: ${formatCurrency(debtTotal)}/mês</div>
                        <button onclick="handleSpaceClick('1-3')" class="btn-primary">Confirmar Dívidas</button>
                    `;
                    break;
                case '1-3': // Tipo de Empréstimo (Entrada)
                    html = `
                        <h3 class="text-xl font-bold mb-4">Estratégia de Entrada</h3>
                        <div class="grid gap-3 w-full mb-4">
                            <button onclick="setDP(0.035)" class="p-3 border rounded hover:bg-gray-700 ${gameState.downPaymentPct===0.035?'bg-blue-900 border-blue-500':''}">3.5% (Mínimo)</button>
                            <button onclick="setDP(0.20)" class="p-3 border rounded hover:bg-gray-700 ${gameState.downPaymentPct===0.20?'bg-blue-900 border-blue-500':''}">20% (Sem PMI)</button>
                        </div>
                        <button onclick="advanceStage()" class="btn-primary">Confirmar Estratégia</button>
                    `;
                    break;
                case '1-4': // Pré-Aprovação
                    const market = MARKET_SCENARIOS[gameState.market];
                    const debtSum = Object.values(gameState.currentDebts).reduce((a,b)=>a+b,0);
                    
                    const maxMonthly = (gameState.income * MAX_DTI) - debtSum; 
                    const estRate = market.interestRate / 12;
                    const terms = 360; 
                    const maxLoan = maxMonthly * ((1 - Math.pow(1 + estRate, -terms)) / estRate); 
                    const maxPrice = roundToNearest(maxLoan / (1-gameState.downPaymentPct), 5000); 
                    
                    saveGameState({ maxOfferPrice: maxPrice });

                    html = `
                        <div class="bg-white text-black p-6 rounded shadow-xl w-full max-w-sm">
                            <h2 class="text-2xl font-bold text-primary mb-2">PRÉ-APROVADO</h2>
                            <p class="text-gray-600 text-sm">Você está autorizado a comprar por até:</p>
                            <p class="text-4xl font-black my-4">${formatCurrency(maxPrice)}</p>
                            <div class="text-xs text-gray-500 border-t pt-2 font-bold">Baseado em sua Renda e Dívidas</div>
                        </div>
                        <button onclick="advanceStage()" class="btn-primary mt-6">Começar a Buscar</button>
                    `;
                    break;
                case '2-1': // Busca (COM IMAGENS)
                    if(currentListings.length === 0) {
                        const base = gameState.maxOfferPrice;
                        currentListings = [
                            {id:1, addr:"Rua dos Reformadores, 123", price: base*0.8, type:"bad", img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=500&q=80"},
                            {id:2, addr:"Avenida Padrão, 456", price: base*0.95, type:"ok", img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=500&q=80"},
                            {id:3, addr:"Alameda dos Sonhos, 789", price: base*1.05, type:"good", img: "https://images.unsplash.com/photo-1600596542815-e32cbbbf4a63?w=500&q=80"}
                        ];
                    }
                    html = `
                        <h3 class="text-xl font-bold mb-4">Imóveis Disponíveis</h3>
                        <div class="space-y-4 w-full max-h-[400px] overflow-y-auto pr-2">
                            ${currentListings.map(l => `
                                <div onclick="selectProp(${l.id})" class="bg-gray-800 rounded-xl overflow-hidden cursor-pointer hover:ring-2 ring-accent transition shadow-lg group">
                                    <div class="relative h-32 overflow-hidden">
                                        <img src="${l.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Imagem da propriedade">
                                        <div class="absolute bottom-0 left-0 bg-black bg-opacity-60 px-2 py-1 text-xs text-white font-bold">${l.addr}</div>
                                    </div>
                                    <div class="p-3 flex justify-between items-center">
                                        <span class="text-sm text-gray-300">3 Quartos | 2 Banheiros</span>
                                        <span class="font-bold text-accent text-lg">${formatCurrency(l.price)}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    break;
                case '2-2': // Comparar
                    if (!gameState.property) return 'Selecione um imóvel primeiro.';
                    html = `
                        <h3 class="text-xl font-bold mb-2">Análise de Vendas Comparáveis</h3>
                        <p class="mb-4 text-sm text-gray-400">Analisando o valor do bairro...</p>
                        <div class="bg-blue-900 bg-opacity-30 border border-blue-500 p-4 rounded w-full mb-4">
                            <p>Venda Recente 1: ${formatCurrency(gameState.property.price * 0.98)}</p>
                            <p>Venda Recente 2: ${formatCurrency(gameState.property.price * 1.02)}</p>
                        </div>
                        <p class="text-sm">O preço de tabela parece justo.</p>
                        <button onclick="advanceStage()" class="btn-primary mt-4">Continuar</button>
                    `;
                    break;
                case '2-3': // Selecionar (COM IMAGEM)
                    if (!gameState.property) return 'Selecione um imóvel primeiro.';
                    html = `
                        <h3 class="text-xl font-bold mb-2">Imóvel Selecionado</h3>
                        <div class="w-full h-48 rounded-xl overflow-hidden mb-4 shadow-2xl border-2 border-accent">
                            <img src="${gameState.property.img}" class="w-full h-full object-cover" alt="Imóvel Selecionado">
                        </div>
                        <p class="text-xl font-bold">${gameState.property.addr}</p>
                        <p class="text-accent text-2xl font-black mb-6">${formatCurrency(gameState.property.price)}</p>
                        <button onclick="advanceStage()" class="btn-primary">Elaborar Proposta</button>
                    `;
                    break;
                case '2-4': // Oferta
                    if (!gameState.property) return 'Selecione um imóvel primeiro.';
                    html = `
                        <h3 class="text-xl font-bold mb-4">Enviar Proposta</h3>
                        <p class="mb-2">Preço de Tabela: ${formatCurrency(gameState.property.price)}</p>
                        <input type="number" id="offerVal" value="${gameState.property.price}" class="input-field text-xl font-bold" />
                        <button onclick="makeOffer()" class="btn-primary w-full">Enviar Proposta</button>
                    `;
                    break;
                case '3-1': // Inspeção
                    html = `
                        <h3 class="text-xl font-bold mb-4 text-yellow-400">Relatório de Inspeção</h3>
                        <div class="text-left bg-gray-800 p-4 rounded w-full mb-4 text-sm">
                            <ul class="list-disc pl-4 space-y-2">
                                <li>Telhas do telhado gastas (Pequeno)</li>
                                <li>Aquecedor de água antigo (Médio)</li>
                            </ul>
                        </div>
                        <div class="flex gap-2 w-full">
                            <button onclick="advanceStage()" class="bg-green-600 text-white p-2 rounded flex-1 font-bold">Aceitar Como Está</button>
                            <button onclick="showModal('Negociação', 'Você solicitou R$ 2.000 de crédito. O vendedor aceitou!'); advanceStage();" class="bg-blue-600 text-white p-2 rounded flex-1 font-bold">Negociar Crédito</button>
                        </div>
                    `;
                    break;
                case '3-2': // Avaliação
                    html = `
                        <h3 class="text-xl font-bold mb-4">Avaliação Bancária</h3>
                        <div class="w-32 h-32 rounded-full border-4 border-green-500 flex items-center justify-center mx-auto mb-4 bg-gray-800">
                            <span class="font-bold text-green-400">APROVADO</span>
                        </div>
                        <p>O valor de avaliação corresponde ao preço da oferta.</p>
                        <button onclick="advanceStage()" class="btn-primary mt-4">Próximo</button>
                    `;
                    break;
                case '3-3': // Fechamento
                    html = `
                        <h3 class="text-xl font-bold mb-2">Números Finais</h3>
                        <div class="bg-white text-black p-4 rounded w-full mb-4 text-sm">
                            <div class="flex justify-between border-b py-1"><span>Preço</span><span>${formatCurrency(gameState.offer.price)}</span></div>
                            <div class="flex justify-between border-b py-1"><span>Taxa Juros</span><span>${formatPercent(MARKET_SCENARIOS[gameState.market].interestRate)}</span></div>
                            <div class="flex justify-between font-bold py-2"><span>Dinheiro para Fechamento</span><span>${formatCurrency(gameState.offer.price * gameState.downPaymentPct + 8000)}</span></div>
                        </div>
                        <button onclick="advanceStage()" class="btn-primary">Assinar Documentos</button>
                    `;
                    break;
                case '3-4': // Chaves
                    if (!gameState.property) return 'Erro.';
                    html = `
                        <div class="animate-bounce text-6xl mb-4">🔑</div>
                        <h2 class="text-3xl font-black text-white mb-2">PARABÉNS!</h2>
                        <div class="w-full h-40 rounded-lg overflow-hidden mb-4 opacity-80">
                            <img src="${gameState.property.img}" class="w-full h-full object-cover" alt="Casa comprada">
                        </div>
                        <p class="mb-6">Você é o novo proprietário de ${gameState.property.addr}!</p>
                        <button onclick="resetGame()" class="bg-white text-black px-6 py-2 rounded-full font-bold hover:bg-gray-200">Jogar Novamente</button>
                    `;
                    break;
                default:
                    html = 'Erro: Conteúdo não encontrado';
            }
            content.innerHTML = html;
        };

        // --- WINDOW HELPERS ---
        window.selectMarket = (key) => {
            const m = MARKET_SCENARIOS[key];
            saveGameState({ 
                market: key, 
                income: m.startIncome, 
                savings: m.startSavings, 
                currentDebts: m.startDebts 
            });
            advanceStage();
        };

        window.setDP = (pct) => {
            saveGameState({ downPaymentPct: pct });
        };

        window.selectProp = (id) => {
            const prop = currentListings.find(l=>l.id===id);
            saveGameState({ property: prop });
            advanceStage();
        };

        window.makeOffer = () => {
            const val = document.getElementById('offerVal').value;
            saveGameState({ offer: { price: val } });
            advanceStage();
        };

        // Modal Logic
        const modal = document.getElementById('modal');
        window.showModal = (title, body) => {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = body;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };
        window.hideModal = () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        // Init
        renderCenterContent('start');
        updateUI();

    </script>
</body>
</html>
