<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristiano Jarbas Tycoon - US Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/phosphor-icons"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --color-primary: #1E40FF; /* Blue */
            --color-secondary: #C8102E; /* Red */
            --color-accent: #FFC300; /* Gold */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #f3f4f6;
        }
        
        .btn-primary {
            /* Otimizado para toque no mobile: padding generoso e largura total */
            @apply px-6 py-3 rounded-xl font-bold transition duration-200 shadow-lg text-white w-full flex items-center justify-center gap-2;
            background-color: var(--color-secondary);
        }
        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary {
             @apply px-6 py-3 rounded-xl font-bold transition duration-200 shadow-lg text-gray-900 bg-gray-300 w-full flex items-center justify-center gap-2;
        }

        .input-field {
            /* Input claro para facilitar a leitura no mobile */
            @apply w-full p-3 bg-white text-black border border-gray-600 rounded mb-2 focus:border-accent focus:outline-none transition;
            color: black !important; 
        }
        .label-text {
            @apply block text-sm font-bold text-gray-400 mb-1 text-left;
        }

        .smoke-effect {
            box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.3), 0 0 30px 10px rgba(255, 255, 255, 0.15) inset;
        }
        
        .game-board {
            /* Garante que o tabuleiro não ultrapasse a largura da tela em dispositivos pequenos */
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px; /* Reduzido o gap para caber melhor no mobile */
            max-width: 95vw; /* Ajuste para não ter scroll lateral */
            max-width: 800px;
            aspect-ratio: 1 / 1;
            margin: 15px auto; /* Margin menor no mobile */
            border: 8px solid var(--color-secondary); /* Borda menor */
            border-radius: 18px;
            background-color: #0d1117;
        }

        .board-space {
            padding: 2px; /* Reduzido padding para caber o texto */
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.7rem; /* Tamanho de fonte menor por padrão */
        }

        .board-space i {
             font-size: 1.2rem; /* Ícones menores por padrão */
        }

        /* AJUSTES ESPECÍFICOS PARA DISPOSITIVOS MENORES (CELULAR) */
        @media (max-width: 640px) {
             .board-space { font-size: 0.55rem; padding: 2px; }
             .board-space i { font-size: 1rem; }
             .game-board { gap: 6px; border: 6px solid var(--color-secondary); }
             .center-display { padding: 10px; }
             
             .text-3xl { font-size: 1.5rem; } /* Títulos menores */
             .text-2xl { font-size: 1.25rem; } /* Subtítulos menores */
             .center-content { min-height: 250px; } /* Garante altura mínima para o conteúdo central */
        }
        
        /* Layout do Tabuleiro - Mantido */
        .space-start { grid-area: 5 / 5 / 6 / 6; }
        .space-1-1 	{ grid-area: 5 / 4 / 6 / 5; }
        .space-1-2 	{ grid-area: 5 / 3 / 6 / 4; }
        .space-1-3 	{ grid-area: 5 / 2 / 6 / 3; }
        .space-1-4 	{ grid-area: 5 / 1 / 6 / 2; }
        .space-2-1 	{ grid-area: 4 / 1 / 5 / 2; }
        .space-2-2 	{ grid-area: 3 / 1 / 4 / 2; }
        .space-2-3 	{ grid-area: 2 / 1 / 3 / 2; }
        .space-2-4 	{ grid-area: 1 / 1 / 2 / 2; }
        .space-3-1 	{ grid-area: 1 / 2 / 2 / 3; }
        .space-3-2 	{ grid-area: 1 / 3 / 2 / 4; }
        .space-3-3 	{ grid-area: 1 / 4 / 2 / 5; }
        .space-3-4 	{ grid-area: 1 / 5 / 2 / 6; }

        .center-display {
            grid-area: 2 / 2 / 5 / 5;
            background-color: #1f2937;
            border-radius: 12px;
            padding: 15px; /* Padding ajustado */
            overflow-y: auto; /* Garante scroll em conteúdo longo */
            border: 1px solid #374151;
        }

        .center-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        /* Modal otimizado para mobile */
        #modal > div {
            @apply w-full max-w-lg mx-2; /* Ocupa quase a largura total da tela */
        }
        @media (max-width: 640px) {
             /* O modal ocupa a tela inteira, removendo bordas arredondadas e margin lateral */
            #modal > div {
                @apply w-full max-w-full mx-0 rounded-none min-h-screen;
            }
        }


        .stage-active {
            box-shadow: 0 0 20px var(--color-primary); 
            border: 2px solid var(--color-primary);
            z-index: 20;
            transform: scale(1.05);
        }
        .zone-1 { background-color: var(--color-primary); } 
        .zone-2 { background-color: var(--color-secondary); } 
        .zone-3 { background-color: #475569; } 
        .space-start { background-color: #10B981; } 

    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-gray-900 shadow-lg py-3 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-xl md:text-3xl font-black text-white flex items-center justify-center gap-1">
                <div class="h-8 w-8 md:h-8 w-8 rounded-full border-2 border-accent smoke-effect flex items-center justify-center relative" style="background-color: white;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E40FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="feather feather-home">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="absolute text-xs font-black text-gray-900" style="margin-top: 2px; color: black;">CJ</span> 
                </div>
                
                <span>CJ <span class="text-primary hidden sm:inline">Tycoon</span> (US/MA)</span>

    </header>

    <main class="flex-grow p-2 sm:p-4">
        <div id="game-status" class="text-center mb-3 text-sm font-semibold text-gray-400">
            Mercado: <span id="market-display" class="text-white">N/A</span> | Orçamento: <span id="budget-display" class="text-white">N/A</span>
        </div>

        <div class="game-board">
            <div id="space-start" class="board-space space-start" onclick="handleSpaceClick('start')">
                <i class="ph ph-flag-checkered mb-1"></i>
                INICIAR
            </div>
            
            <div id="space-ranking" class="board-space zone-1 disabled" onclick="renderCenterContent('ranking')" style="grid-area: 2 / 5 / 3 / 6; background-color: #374151;">
                <i class="ph ph-trophy mb-1"></i> RANKING
            </div>

            <div id="space-calculator" class="board-space zone-1 disabled" onclick="renderCenterContent('calculator')" style="grid-area: 3 / 5 / 4 / 6; background-color: #374151;">
                <i class="ph ph-calculator mb-1"></i> CALC.
            </div>
            
            <div id="space-social" class="board-space zone-1 disabled" onclick="renderCenterContent('social')" style="grid-area: 4 / 5 / 5 / 6; background-color: #059669;"> 
                <i class="ph ph-share-network mb-1"></i> SOCIAL
            </div>

            <div id="space-1-1" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-1')">

            <div id="space-1-2" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-2')">

            </div>
            <div id="space-1-3" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-3')">
                <i class="ph ph-percent mb-1"></i> Entrada
            </div>
            <div id="space-1-4" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-4')">
                <i class="ph ph-file-text mb-1"></i> Pré-Ap.
            </div>

            <div id="space-2-1" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-1')">
                <i class="ph ph-magnifying-glass mb-1"></i> Buscar
            </div>
            <div id="space-2-2" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-2')">
                <i class="ph ph-chart-bar mb-1"></i> Comparar
            </div>
            <div id="space-2-3" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-3')">
                <i class="ph ph-house-line mb-1"></i> Sel.
            </div>
            <div id="space-2-4" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-4')">

            </div>

            <div id="space-3-1" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-1')">
                <i class="ph ph-toolbox mb-1"></i> Insp.
            </div>
            <div id="space-3-2" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-2')">
                <i class="ph ph-bank mb-1"></i> Aval.
            </div>
            <div id="space-3-3" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-3')">
                <i class="ph ph-file-pdf mb-1"></i> Fecha.
            </div>
            <div id="space-3-4" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-4')">
                <i class="ph ph-key mb-1"></i> Chaves!
            </div>

            <div class="center-display">
                <div id="center-content" class="center-content">
                    </div>
            </div>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center p-0 sm:p-4 z-50">
        <div class="bg-white text-gray-900 w-full max-w-lg rounded-none sm:rounded-2xl shadow-2xl overflow-hidden min-h-screen sm:min-h-0">
            <div class="bg-gray-100 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold flex items-center"></h3>
                <button onclick="hideModal()" class="text-gray-500 hover:text-red-500">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6"></div>
            <div id="modal-footer" class="px-6 py-4 bg-gray-50 flex justify-end">
                <button onclick="hideModal()" class="btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script>
        // 🚨🚨🚨 2. INICIALIZAÇÃO FIREBASE - VOCÊ DEVE SUBSTITUIR PELAS SUAS CHAVES AQUI! 🚨🚨🚨
        // ====================================================================================
        const firebaseConfig = {
            // !!! SUBSTITUA ESTES PLACEHOLDERS PELAS SUAS CHAVES REAIS !!!
            apiKey: "[SUA API KEY AQUI]", 
            authDomain: "[SEU AUTH DOMAIN AQUI]",
            projectId: "[SEU PROJECT ID AQUI]",
            storageBucket: "[SEU STORAGE BUCKET AQUI]",
            messagingSenderId: "[SEU MESSAGING SENDER ID AQUI]",
            appId: "[SEU APP ID AQUI]"
        };
        // ====================================================================================

        let db;
        let isFirebaseConfigured = false;

        // Função de placeholder para Ranking (se Firebase não estiver configurado)
        const placeholderSaveRanking = async (name, score, time) => {
             console.log("Ranking simulado. Configure o Firebase para salvar. Nome:", name, "Score:", score);
             showModal("Aviso", "O Ranking não está ativo. Por favor, insira suas credenciais do Firebase no código.", "OK");
        };
        const placeholderLoadRanking = async () => [{ name: "CJ Tycoon (Demo)", score: 1000000, timeMs: 60000 }];
        
        // Inicialização do Firebase
        try {
            isFirebaseConfigured = firebaseConfig.projectId && firebaseConfig.projectId.includes("SEU PROJECT ID") === false;
            
            if (typeof firebase !== 'undefined' && isFirebaseConfigured) {
                 if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                 }
                 db = firebase.firestore();
                 // Usa as funções reais do Firebase
                 window.saveRanking = saveRankingFirebase;
                 window.loadRanking = loadRankingFirebase;
            } else {
                 console.warn("Firebase não inicializado. Configure firebaseConfig com suas credenciais para usar o Ranking.");
                 // Usa as funções de placeholder
                 window.saveRanking = placeholderSaveRanking;
                 window.loadRanking = placeholderLoadRanking;
            }
        } catch(e) {
            console.error("Erro ao inicializar Firebase: ", e);
            // Mesmo com erro, usa o placeholder para não quebrar o jogo
            window.saveRanking = placeholderSaveRanking;
            window.loadRanking = placeholderLoadRanking;
        }
        
        // --- CONSTANTES E CONFIGURAÇÃO ---
        
        // Taxas baseadas no Credit Score (EUA)
        const CREDIT_RATES = {
            excellent: { min: 740, rate: 0.062, name: "Excelente" }, 
            good: { min: 670, rate: 0.070, name: "Bom" },
            fair: { min: 580, rate: 0.082, name: "Regular" },
            poor: { min: 300, rate: 0.095, name: "Ruim" } 
        };

        // Cenários ajustados para o mercado de Massachusetts/EUA
        const MARKET_SCENARIOS = {
            easy: {
                name: "Subúrbio de Worcester (Starter)", 
                priceRange: [350000, 500000], 
                taxRate: 0.009, // 0.9% de imposto anual (relativo a MA)
                interestRate: 0.068,
                startSavings: 35000, 
                startIncome: 6000, // Renda mensal em USD
                startDebts: { Cartão: 300, Carro: 400, Estudo: 150 }, 
                scoreMult: 1.0
            },
            medium: {
                name: "Boston/Cambridge (Quente)", 
                priceRange: [600000, 950000], 
                taxRate: 0.0105, // 1.05% de imposto anual
                interestRate: 0.072,
                startSavings: 100000, 
                startIncome: 12000, 
                startDebts: { Cartão: 800, Carro: 600, Estudo: 350 }, 
                scoreMult: 1.5
            },
            hard: {
                name: "Cape Cod (Luxo Litorâneo)", 
                priceRange: [1200000, 1800000], 
                taxRate: 0.008, 
                interestRate: 0.075,
                startSavings: 250000, 
                startIncome: 20000, 
                startDebts: { Cartão: 1200, Carro: 900, Estudo: 700 }, 
                scoreMult: 2.0
            }
        };

        const stageOrder = ['start', '1-1', '1-2', '1-3', '1-4', '2-1', '2-2', '2-3', '2-4', '3-1', '3-2', '3-3', '3-4', 'complete'];
        const PMI_RATE = 0.005; // Private Mortgage Insurance (Seguro de hipoteca privada)
        const INSURANCE_COST = 2500; // Custo médio anual do seguro residencial nos EUA/MA
        const MAX_DTI = 0.43; // Debt-to-Income Ratio (Padrão EUA)
        const ISSUE_COST = 5000; // Custo médio por problema de inspeção

        let gameState = {
            stage: 'intro', // Começa na tela de introdução/guia
            market: null,
            income: 0,
            savings: 0,
            currentDebts: {},
            downPaymentPct: 0.20,
            maxOfferPrice: 0,
            property: null,
            offer: {},
            inspectionIssues: null,
            appraisalValue: 0,
            startTime: null, 
            endTime: null, 
            finalScore: 0,
            playerName: "Jogador",
            creditScore: 700, 
            effectiveRate: 0, 
            listings: [] // Lista de imóveis gerados
        };

        let currentListings = [];
        let houseIndex = 0; // Para simular diferentes casas na busca

        // --- UTILS ---
        const formatCurrency = (amt) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amt);
        const formatCurrencyFloat = (amt) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amt);
        
        const formatPercent = (val) => (val * 100).toFixed(2) + '%';
        const formatPercentPrecision = (val) => (val * 100).toFixed(3) + '%';
        const roundToNearest = (val, n) => Math.round(val / n) * n;

        const formatTime = (ms) => {
            if (ms < 0 || ms === null) return "0m 0s";
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}m ${seconds}s`;
        };

        const getEffectiveRate = (score) => {
            if (score >= CREDIT_RATES.excellent.min) {
                return CREDIT_RATES.excellent.rate;
            } else if (score >= CREDIT_RATES.good.min) {
                return CREDIT_RATES.good.rate;
            } else if (score >= CREDIT_RATES.fair.min) {
                return CREDIT_RATES.fair.rate;
            } else {
                return CREDIT_RATES.poor.rate;
            }
        };

        // --- LÓGICA DE CÁLCULO DE ORÇAMENTO (DTI) ---
        const calculateMaxBudget = () => {
            const marketData = MARKET_SCENARIOS[gameState.market];
            const annualRate = getEffectiveRate(gameState.creditScore);
            const monthlyRate = annualRate / 12;
            const totalPayments = 30 * 12; // Padrão de 30 anos

            const totalMonthlyDebt = Object.values(gameState.currentDebts).reduce((sum, debt) => sum + debt, 0);

            const maxMonthlyObligation = gameState.income * MAX_DTI;
            const maxMortgagePayment = maxMonthlyObligation - totalMonthlyDebt;

            if (maxMortgagePayment <= 0) {
                saveGameState({ maxOfferPrice: 0 });
                return 0;
            }

            // Estimativa de componentes que variam com o preço (Taxas e Seguro)
            const monthlyTaxInsurance = (marketData.priceRange[1] * marketData.taxRate / 12) + (INSURANCE_COST / 12);
            const maxLoanPaymentPrincipalInterest = maxMortgagePayment - monthlyTaxInsurance;

            if (maxLoanPaymentPrincipalInterest <= 0) {
                saveGameState({ maxOfferPrice: 0 });
                return 0;
            }

            // Reverso da Fórmula de Hipoteca
            const L = maxLoanPaymentPrincipalInterest * (Math.pow(1 + monthlyRate, totalPayments) - 1) / (monthlyRate * Math.pow(1 + monthlyRate, totalPayments));

            // Preço Máximo da Oferta (Loan + Down Payment)
            const maxPrice = L / (1 - gameState.downPaymentPct);

            const finalMaxOffer = roundToNearest(maxPrice, 5000);
            
            saveGameState({ 
                maxOfferPrice: finalMaxOffer,
                effectiveRate: annualRate
            });
            return finalMaxOffer;
        };
        
        // Calcula a parcela mensal completa
        const calculateTotalMonthlyPayment = (price, downPaymentPct, appraisalValue) => {
            const marketData = MARKET_SCENARIOS[gameState.market];
            const loanAmount = Math.min(price, appraisalValue || price) * (1 - downPaymentPct);
            const annualRate = getEffectiveRate(gameState.creditScore);
            const monthlyRate = annualRate / 12;
            const totalPayments = 30 * 12;

            let PI_payment;
            if (monthlyRate === 0) {
                PI_payment = loanAmount / totalPayments;
            } else {
                PI_payment = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, totalPayments)) / (Math.pow(1 + monthlyRate, totalPayments) - 1);
            }
            
            const taxes = (price * marketData.taxRate) / 12;
            const insurance = INSURANCE_COST / 12;
            
            let pmi = 0;
            if (downPaymentPct < 0.20) {
                pmi = loanAmount * PMI_RATE / 12;
            }

            return {
                PI: PI_payment,
                Taxes: taxes,
                Insurance: insurance,
                PMI: pmi,
                Total: PI_payment + taxes + insurance + pmi
            };
        };

        // --- SIMULAÇÃO DE LISTAGEM ---
        const generateTestListings = () => {
             // Lista fixa de imóveis para simulação
             currentListings = [
                { id: `H1`, price: 600000, beds: 3, baths: 2, size: 180, appraisal: 560000, issues: 2, negotiation: 0.95, isSelected: false }, 
                { id: `H2`, price: 450000, beds: 2, baths: 1, size: 150, appraisal: 465000, issues: 1, negotiation: 0.98, isSelected: false },
                { id: `H3`, price: 500000, beds: 4, baths: 3, size: 220, appraisal: 490000, issues: 0, negotiation: 0.93, isSelected: false },
             ];
             saveGameState({ listings: currentListings });
        }


        // --- LÓGICA DE PONTUAÇÃO ---
        const calculateScore = () => {
            if (!gameState.property || !gameState.market || !gameState.startTime) {
                return 0;
            }

            const marketData = MARKET_SCENARIOS[gameState.market];
            const propertyPrice = gameState.property.initialPrice; // Usa o preço de listagem para base
            const offerPrice = gameState.offer.price || propertyPrice; 
            const timeElapsedMs = (gameState.endTime || Date.now()) - gameState.startTime;
            
            const negotiationFactor = 1 + ((propertyPrice - offerPrice) / propertyPrice) * 0.5; 
            
            const targetTimeMs = 10 * 60 * 1000; // 10 minutos
            const timePenaltyFactor = Math.min(2.0, targetTimeMs / timeElapsedMs) || 1.0; 
            
            let baseScore = Math.round(propertyPrice / 1000 * negotiationFactor * timePenaltyFactor);
            baseScore *= marketData.scoreMult; 

            if (gameState.appraisalValue < offerPrice) {
                 const gap = offerPrice - gameState.appraisalValue;
                 baseScore -= (gap / 10000) * (baseScore * 0.20); // Penalidade por cash gap
            }
            
            const finalScore = Math.round(Math.max(0, baseScore));

            saveGameState({ finalScore: finalScore, endTime: gameState.endTime || Date.now() });
            return finalScore;
        };

        // --- FIREBASE (RANKING) - Funções Reais ---
        async function saveRankingFirebase(name, score, time) {
            if (!db) return placeholderSaveRanking(name, score, time);
            try {
                await db.collection("rankings_us").add({ 
                    name: name,
                    score: score,
                    timeMs: time,
                    market: gameState.market,
                    date: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) {
                console.error("Erro ao salvar o ranking: ", e);
                showModal("Erro de Ranking", "Não foi possível salvar sua pontuação no servidor.", "OK");
            }
        }

        async function loadRankingFirebase() {
            if (!db) return placeholderLoadRanking();
            try {
                const snapshot = await db.collection("rankings_us") 
                                             .orderBy("score", "desc")
                                             .limit(10)
                                             .get();
                
                return snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
            } catch (e) {
                console.error("Erro ao carregar o ranking: ", e);
                return placeholderLoadRanking();
            }
        }

        // --- CORE FUNCTIONS ---
        const getNextStage = (current) => {
            const idx = stageOrder.indexOf(current);
            return (idx !== -1 && idx < stageOrder.length - 1) ? stageOrder[idx + 1] : 'complete';
        };

        const saveGameState = (updates) => {
            gameState = { ...gameState, ...updates };
            updateUI();
        };

        const updateUI = () => {
            const mkt = gameState.market ? MARKET_SCENARIOS[gameState.market].name : 'N/A';
            const budget = gameState.maxOfferPrice > 0 ? formatCurrency(gameState.maxOfferPrice) : 'N/A';
            document.getElementById('market-display').innerText = mkt;
            document.getElementById('budget-display').innerText = budget;

            document.querySelectorAll('.board-space').forEach(el => {
                el.classList.remove('stage-active');
                if (!['ranking', 'calculator', 'social'].includes(el.id.replace('space-', ''))) {
                    el.classList.add('disabled');
                }
            });

                    const finalCashGap = Math.max(0, gameState.offer.price - gameState.appraisalValue);
                    const finalClosingCosts = Math.round(gameState.offer.price * 0.035);
                    const finalPaymentDetails = calculateTotalMonthlyPayment(gameState.offer.price, gameState.downPaymentPct, gameState.appraisalValue);

                    const requiredCash = finalDownPayment + finalCashGap;
                    const finalCashOut = requiredCash + finalClosingCosts;
                    
                    html = `
                        <h3 class="text-2xl font-bold mb-4"><i class="ph ph-file-pdf text-3xl mr-2"></i> 3-3. Documentos Finais</h3>
                        <div class="bg-gray-700 p-4 rounded mb-6 w-full max-w-sm text-left text-sm">
                            <p class="font-bold text-lg mb-2 text-accent">Prestação MENSAL da Hipoteca: ${formatCurrencyFloat(finalPaymentDetails.Total)}</p>
                            <p class="text-gray-400 text-xs">(PI: ${formatCurrencyFloat(finalPaymentDetails.PI)} | Taxas: ${formatCurrencyFloat(finalPaymentDetails.Taxes)} | Seguro: ${formatCurrencyFloat(finalPaymentDetails.Insurance)} ${finalPaymentDetails.PMI > 0 ? `| PMI: ${formatCurrencyFloat(finalPaymentDetails.PMI)}` : ''})</p>
                            <hr class="my-2 border-gray-600">
                            <p class="font-bold mb-2">Resumo de Custos de Fechamento:</p>
                            <p>Preço Final Negociado: **${formatCurrency(gameState.offer.price)}**</p>
                            <p>Valor do Empréstimo (Hipoteca): **${formatCurrency(finalLoan)}**</p>
                            <hr class="my-1 border-gray-600">
                            <p>Entrada (${formatPercent(gameState.downPaymentPct)}): **${formatCurrency(finalDownPayment)}**</p>
                            <p>Cash Gap (Se Aval. < Preço): **${formatCurrency(finalCashGap)}**</p>
                            <p>Custos de Fechamento (aprox 3.5%): **${formatCurrency(finalClosingCosts)}**</p>
                            <hr class="my-1 border-gray-600">
                            <p class="font-bold text-lg">Cash Total Necessário: **${formatCurrency(finalCashOut)}**</p>
                            <p>Suas Economias: **${formatCurrency(gameState.savings)}**</p>
                        </div>
                        <button class="btn-primary" onclick="closeTransaction()">
                            <i class="ph ph-key"></i> FECHAR NEGÓCIO E OBTER CHAVES
                        </button>
                    `;
                    break;
                case '3-4': // Chaves (Fim de Jogo)
                    html = `
                        <h3 class="text-2xl font-bold mb-4"><i class="ph ph-trophy text-3xl mr-2"></i> Jogo Concluído!</h3>
                        <p class="text-4xl font-black text-accent mb-6">${formatCurrency(gameState.finalScore)}</p>
                        <p class="text-gray-400 mb-4">Tempo de Jogo: **${formatTime(gameState.endTime - gameState.startTime)}**</p>
                        <div class="w-full max-w-sm">
                            <div class="mb-4">
                                <label for="player-name" class="label-text">Seu Nome para o Ranking:</label>
                                <input type="text" id="player-name" class="input-field" value="${gameState.playerName}">
                            </div>
                            <button class="btn-primary btn-submit-score mb-4" onclick="submitScore()">
                                <i class="ph ph-upload"></i> ENVIAR PONTUAÇÃO
                            </button>
                            <button class="btn-secondary" onclick="resetGame()">
                                <i class="ph ph-arrow-counter-clockwise"></i> REINICIAR JOGO
                            </button>
                        </div>
                    `;
                    break;
                case 'ranking':
                    const listContainerId = 'ranking-list-container';
                    html = `
                         <h3 class="text-2xl font-bold mb-4"><i class="ph ph-trophy text-3xl mr-2"></i> Ranking de Compradores</h3>
                         <div id="${listContainerId}" class="w-full text-left text-gray-400 max-w-lg">Carregando ranking...</div>
                     `;
                    
                    content.innerHTML = html; // Renderiza o container antes de carregar os dados
                    const listContainer = document.getElementById(listContainerId);

                    if (!isFirebaseConfigured) {
                        listContainer.innerHTML = '<p class="text-red-400 font-bold">⚠️ Falha no Ranking: O Firebase não foi configurado ou inicializado. Verifique as credenciais no código.</p>';
                        return;
                    }

                    const rankings = await window.loadRanking();
                     
                    if (Array.isArray(rankings) && rankings.length === 0) {
                        listContainer.innerHTML = '<p class="text-gray-400">Nenhum score encontrado. Jogue e seja o primeiro!</p>';
                    } else {
                        let rankingHtml = `<ul class="space-y-2">`;
                        rankings.forEach((r, index) => {
                            const rank = index + 1;
                            const score = formatCurrency(r.score);
                            const time = formatTime(r.timeMs);
                            const rankColor = rank === 1 ? 'text-accent' : rank <= 3 ? 'text-white' : 'text-gray-400';
                            
                            rankingHtml += `
                                <li class="flex justify-between items-center p-3 rounded-lg ${rank === 1 ? 'bg-gray-600 border border-accent' : 'bg-gray-800'}">
                                    <span class="font-black ${rankColor} w-10">${rank}.</span>
                                    <span class="flex-1">${r.name}</span>
                                    <span class="text-sm w-24 text-right">${time}</span>
                                    <span class="font-bold w-32 text-right ${rankColor}">${score}</span>
                                </li>
                            `;
                        });
                        rankingHtml += `</ul>`;
                        listContainer.innerHTML = rankingHtml;
                    }
                    return; // Retorna aqui para evitar que o conteúdo seja substituído novamente
                
                case 'calculator': // Calculadora
                    html = `
                        <h3 class="text-2xl font-bold mb-4"><i class="ph ph-calculator text-3xl mr-2"></i> Calculadora de Pagamento</h3>
                        <p class="text-sm text-gray-400 mb-4">Calcule o pagamento mensal estimado de uma hipoteca.</p>
                        <div class="w-full max-w-sm space-y-3">
                            <div>
                                <label for="calc-price" class="label-text">Preço do Imóvel (USD)</label>
                                <input type="number" id="calc-price" class="input-field" value="450000">
                            </div>
                            <div>
                                <label for="calc-dp" class="label-text">Entrada (%)</label>
                                <input type="number" id="calc-dp" class="input-field" value="20">
                            </div>
                            <button class="btn-primary" onclick="calculateMortgage()">
                                <i class="ph ph-check"></i> CALCULAR
                            </button>
                            <div id="calc-result" class="mt-4 bg-gray-700 p-3 rounded text-left text-sm hidden"></div>
                        </div>
                    `;
                    break;
                case 'social': // Social (Placeholder)
                     html = `
                        <h3 class="text-2xl font-bold mb-4"><i class="ph ph-share-network text-3xl mr-2"></i> Social (Em Breve)</h3>
                        <p class="text-gray-400 mb-6">Aqui seria a seção para compartilhar sua pontuação nas redes sociais!</p>
                        <button class="btn-primary" onclick="showModal('Redes Sociais', 'Compartilhe seu score de ${formatCurrency(gameState.finalScore)}!', 'Legal!')">
                            <i class="ph ph-twitter-logo"></i> Compartilhar
                        </button>
                    `;
                    break;
                default:
                    html = `<p class="text-red-400">Etapa desconhecida: ${stage}</p>`;
                    break;
            }

            content.innerHTML = html;
        };
        
        window.calculateMortgage = () => {
            const price = parseFloat(document.getElementById('calc-price').value);
            const dpPct = parseFloat(document.getElementById('calc-dp').value) / 100;
            const resultDiv = document.getElementById('calc-result');

            if (isNaN(price) || isNaN(dpPct) || price <= 0 || dpPct < 0 || dpPct > 1) {
                resultDiv.innerHTML = '<p class="text-red-400">Insira valores válidos.</p>';
                resultDiv.classList.remove('hidden');
                return;
            }

            // Temporariamente ajusta o gameState para usar a taxa do cenário fácil para a calculadora
            if (!gameState.market) gameState.market = 'easy'; 
            if (!gameState.creditScore) gameState.creditScore = 700;
            
            const payment = calculateTotalMonthlyPayment(price, dpPct);
            const dti = (Object.values(gameState.currentDebts).reduce((sum, debt) => sum + debt, 0) + payment.Total) / gameState.income;

            resultDiv.innerHTML = `
                <p class="font-bold text-lg mb-2">Pagamento Mensal Total Estimado: ${formatCurrencyFloat(payment.Total)}</p>
                <p>Principal & Juros (PI): ${formatCurrencyFloat(payment.PI)}</p>
                <p>Impostos (Taxes): ${formatCurrencyFloat(payment.Taxes)}</p>
                <p>Seguro (Insurance): ${formatCurrencyFloat(payment.Insurance)}</p>
                ${payment.PMI > 0 ? `<p class="text-red-300">PMI (Seguro Hipoteca - 0.5%): ${formatCurrencyFloat(payment.PMI)}</p>` : ''}
                <p class="mt-2">DTI (Est.): ${formatPercent(dti)}</p>
            `;
            resultDiv.classList.remove('hidden');
        };

        // --- MODAL FUNCTIONS ---
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalFooter = document.getElementById('modal-footer');

        window.showModal = (title, bodyHtml, buttonText) => {
            modalTitle.innerHTML = title;
            modalBody.innerHTML = `<p>${bodyHtml}</p>`;
            
            // Botão customizado para Reiniciar em caso de Falha
            if (buttonText === 'REINICIAR JOGO') {
                 modalFooter.innerHTML = `<button onclick="resetGame()" class="btn-primary">${buttonText}</button>`;
            } else if (buttonText === 'CONTINUAR') {
                modalFooter.innerHTML = `<button onclick="hideModal()" class="btn-primary">${buttonText}</button>`;
            } else {
                 modalFooter.innerHTML = `<button onclick="hideModal()" class="btn-primary">${buttonText}</button>`;
            }
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.hideModal = () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        // --- INICIALIZAÇÃO ---
        document.addEventListener('DOMContentLoaded', () => {
            if (gameState.stage === 'intro') {
                renderCenterContent('intro');
            }
            updateUI();
        });
    </script>

</body>
</html>
