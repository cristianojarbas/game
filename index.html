<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristiano Jarbas Tycoon - US Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/phosphor-icons"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --color-primary: #1E40FF; /* Blue */
            --color-secondary: #C8102E; /* Red */
            --color-accent: #FFC300; /* Gold */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #f3f4f6;
        }
        
        .btn-primary {
            @apply px-6 py-3 rounded-xl font-bold transition duration-200 shadow-lg text-white w-full flex items-center justify-center gap-2;
            background-color: var(--color-secondary);
        }
        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary {
             @apply px-6 py-3 rounded-xl font-bold transition duration-200 shadow-lg text-gray-900 bg-gray-300 w-full flex items-center justify-center gap-2;
        }

        .input-field {
            @apply w-full p-2 bg-white text-black border border-gray-600 rounded mb-2 focus:border-accent focus:outline-none transition;
            color: black !important; 
        }
        .label-text {
            @apply block text-sm font-bold text-gray-400 mb-1 text-left;
        }

        .smoke-effect {
            box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.3), 0 0 30px 10px rgba(255, 255, 255, 0.15) inset;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            max-width: 800px;
            aspect-ratio: 1 / 1;
            margin: 20px auto;
            border: 10px solid var(--color-secondary);
            border-radius: 20px;
            background-color: #0d1117;
        }

        .board-space {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            text-align: center;
            font-weight: 600;
            color: white;
            font-size: 0.8rem;
            position: relative;
        }

        @media (max-width: 768px) {
            .board-space { font-size: 0.6rem; }
            .board-space i { font-size: 1.2rem; }
        }

        .board-space.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(100%);
        }
        .board-space:not(.disabled):hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        /* ESTILO PARA DESTAQUE DO PRÓXIMO PASSO (AGORA AZUL) */
        .stage-active {
            box-shadow: 0 0 20px var(--color-primary); 
            border: 2px solid var(--color-primary);
            z-index: 20;
            transform: scale(1.05);
        }

        .zone-1 { background-color: var(--color-primary); } 
        .zone-2 { background-color: var(--color-secondary); } 
        .zone-3 { background-color: #475569; } 
        .space-start { background-color: #10B981; } 

        /* Layout do Tabuleiro */
        .space-start { grid-area: 5 / 5 / 6 / 6; }
        .space-1-1 	{ grid-area: 5 / 4 / 6 / 5; }
        .space-1-2 	{ grid-area: 5 / 3 / 6 / 4; }
        .space-1-3 	{ grid-area: 5 / 2 / 6 / 3; }
        .space-1-4 	{ grid-area: 5 / 1 / 6 / 2; }
        .space-2-1 	{ grid-area: 4 / 1 / 5 / 2; }
        .space-2-2 	{ grid-area: 3 / 1 / 4 / 2; }
        .space-2-3 	{ grid-area: 2 / 1 / 3 / 2; }
        .space-2-4 	{ grid-area: 1 / 1 / 2 / 2; }
        .space-3-1 	{ grid-area: 1 / 2 / 2 / 3; }
        .space-3-2 	{ grid-area: 1 / 3 / 2 / 4; }
        .space-3-3 	{ grid-area: 1 / 4 / 2 / 5; }
        .space-3-4 	{ grid-area: 1 / 5 / 2 / 6; }

        .center-display {
            grid-area: 2 / 2 / 5 / 5;
            background-color: #1f2937;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #374151;
        }

        .center-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .ranking-list {
            @apply w-full space-y-2;
        }
        .ranking-item {
            @apply flex justify-between p-3 rounded-lg bg-gray-700 items-center;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-gray-900 shadow-lg py-4 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-2xl md:text-3xl font-black text-white flex items-center justify-center gap-2">
                <img src="https://via.placeholder.com/32/FFC300/000000?text=CJ" onerror="this.onerror=null; this.src='https://via.placeholder.com/32/FFC300/000000?text=CJ'" alt="Foto de Perfil" class="h-8 w-8 rounded-full object-cover border-2 border-accent mr-2 smoke-effect">
                <span>Cristiano Jarbas <span class="text-primary">Tycoon</span> (US/MA)</span>
            </h1>
        </div>
    </header>

    <main class="flex-grow p-4">
        <div id="game-status" class="text-center mb-4 text-sm md:text-lg font-semibold text-gray-400">
            Mercado: <span id="market-display" class="text-white">...</span> | Orçamento Máximo: <span id="budget-display" class="text-white">...</span>
        </div>

        <div class="game-board">
            <div id="space-start" class="board-space space-start" onclick="handleSpaceClick('start')">
                <i class="ph ph-flag-checkered text-3xl mb-1"></i>
                INICIAR
            </div>
            
            <div id="space-ranking" class="board-space zone-1" onclick="renderCenterContent('ranking')" style="grid-area: 2 / 5 / 3 / 6; background-color: #374151;">
                <i class="ph ph-trophy text-2xl mb-1"></i> RANKING
            </div>

            <div id="space-calculator" class="board-space zone-1" onclick="renderCenterContent('calculator')" style="grid-area: 3 / 5 / 4 / 6; background-color: #374151;">
                <i class="ph ph-calculator text-2xl mb-1"></i> CALCULADORA
            </div>
            
            <div id="space-social" class="board-space zone-1" onclick="renderCenterContent('social')" style="grid-area: 4 / 5 / 5 / 6; background-color: #059669;"> 
                <i class="ph ph-share-network text-2xl mb-1"></i> SOCIAL
            </div>

            <div id="space-1-1" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-1')">
                <i class="ph ph-money text-2xl mb-1"></i> Renda
            </div>
            <div id="space-1-2" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-2')">
                <i class="ph ph-piggy-bank text-2xl mb-1"></i> Dívidas
            </div>
            <div id="space-1-3" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-3')">
                <i class="ph ph-percent text-2xl mb-1"></i> Entrada
            </div>
            <div id="space-1-4" class="board-space zone-1 disabled" onclick="handleSpaceClick('1-4')">
                <i class="ph ph-file-text text-2xl mb-1"></i> Pré-Aprovação
            </div>

            <div id="space-2-1" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-1')">
                <i class="ph ph-magnifying-glass text-2xl mb-1"></i> Buscar
            </div>
            <div id="space-2-2" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-2')">
                <i class="ph ph-chart-bar text-2xl mb-1"></i> Comparar
            </div>
            <div id="space-2-3" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-3')">
                <i class="ph ph-house-line text-2xl mb-1"></i> Selecionar
            </div>
            <div id="space-2-4" class="board-space zone-2 disabled" onclick="handleSpaceClick('2-4')">
                <i class="ph ph-pencil-line text-2xl mb-1"></i> Oferta
            </div>

            <div id="space-3-1" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-1')">
                <i class="ph ph-toolbox text-2xl mb-1"></i> Inspeção
            </div>
            <div id="space-3-2" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-2')">
                <i class="ph ph-bank text-2xl mb-1"></i> Avaliação
            </div>
            <div id="space-3-3" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-3')">
                <i class="ph ph-file-pdf text-2xl mb-1"></i> Fechamento
            </div>
            <div id="space-3-4" class="board-space zone-3 disabled" onclick="handleSpaceClick('3-4')">
                <i class="ph ph-key text-2xl mb-1"></i> Chaves!
            </div>

            <div class="center-display">
                <div id="center-content" class="center-content">
                    </div>
            </div>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center p-4 z-50">
        <div class="bg-white text-gray-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gray-100 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold flex items-center"></h3>
                <button onclick="hideModal()" class="text-gray-500 hover:text-red-500">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6"></div>
            <div id="modal-footer" class="px-6 py-4 bg-gray-50 flex justify-end">
                <button onclick="hideModal()" class="btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script>
        // 🚨🚨🚨 2. INICIALIZAÇÃO FIREBASE - VOCÊ DEVE SUBSTITUIR PELAS SUAS CHAVES AQUI! 🚨🚨🚨
        // ====================================================================================
        const firebaseConfig = {
            apiKey: "[SUA API KEY AQUI]", 
            authDomain: "[SEU AUTH DOMAIN AQUI]",
            projectId: "[SEU PROJECT ID AQUI]",
            storageBucket: "[SEU STORAGE BUCKET AQUI]",
            messagingSenderId: "[SEU MESSAGING SENDER ID AQUI]",
            appId: "[SEU APP ID AQUI]"
        };
        // ====================================================================================

        let db;
        try {
            // Verifica se a configuração foi preenchida (evitando que o jogo quebre se o usuário esquecer)
            const isConfigured = firebaseConfig.projectId && firebaseConfig.projectId.includes("SEU PROJECT ID") === false;
            
            if (typeof firebase !== 'undefined' && isConfigured) {
                 if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                 }
                 db = firebase.firestore();
            } else {
                 console.warn("Firebase não inicializado. Configure firebaseConfig com suas credenciais para usar o Ranking.");
                 // Funções de Ranking de Placeholder para não quebrar o jogo
                 window.saveRanking = async (name, score, time) => {
                     console.log("Ranking simulado. Configure o Firebase para salvar. Nome:", name, "Score:", score);
                     showModal("Aviso", "O Ranking não está ativo. Por favor, insira suas credenciais do Firebase no código.", "OK");
                 };
                 window.loadRanking = async () => [{ name: "CJ Tycoon (Demo)", score: 1000000, timeMs: 60000 }];
            }
        } catch(e) {
            console.error("Erro ao inicializar Firebase: ", e);
            window.showModal("Erro de Conexão", "Não foi possível conectar ao Ranking. Verifique suas chaves do Firebase e a conexão com a internet.", "OK");
        }
        
        // --- CONSTANTES E CONFIGURAÇÃO ---
        
        // Taxas baseadas no Credit Score (EUA)
        const CREDIT_RATES = {
            excellent: { min: 740, rate: 0.062, name: "Excelente" }, 
            good: { min: 670, rate: 0.070, name: "Bom" },
            fair: { min: 580, rate: 0.082, name: "Regular" },
            poor: { min: 300, rate: 0.095, name: "Ruim" } 
        };

        // Cenários ajustados para o mercado de Massachusetts/EUA
        const MARKET_SCENARIOS = {
            easy: {
                name: "Subúrbio de Worcester (Starter)", 
                priceRange: [350000, 500000], 
                taxRate: 0.009, // 0.9% de imposto anual (relativo a MA)
                interestRate: 0.068,
                startSavings: 35000, 
                startIncome: 6000, // Renda mensal em USD
                startDebts: { Cartão: 300, Carro: 400, Estudo: 150 }, 
                scoreMult: 1.0
            },
            medium: {
                name: "Boston/Cambridge (Quente)", 
                priceRange: [600000, 950000], 
                taxRate: 0.0105, // 1.05% de imposto anual
                interestRate: 0.072,
                startSavings: 100000, 
                startIncome: 12000, 
                startDebts: { Cartão: 800, Carro: 600, Estudo: 350 }, 
                scoreMult: 1.5
            },
            hard: {
                name: "Cape Cod (Luxo Litorâneo)", 
                priceRange: [1200000, 1800000], 
                taxRate: 0.008, 
                interestRate: 0.075,
                startSavings: 250000, 
                startIncome: 20000, 
                startDebts: { Cartão: 1200, Carro: 900, Estudo: 700 }, 
                scoreMult: 2.0
            }
        };

        const stageOrder = ['start', '1-1', '1-2', '1-3', '1-4', '2-1', '2-2', '2-3', '2-4', '3-1', '3-2', '3-3', '3-4', 'complete'];
        const PMI_RATE = 0.005;
        const INSURANCE_COST = 2500; // Custo médio anual do seguro residencial nos EUA/MA
        const MAX_DTI = 0.43; // Debt-to-Income Ratio (Padrão EUA)

        let gameState = {
            stage: 'intro', // Começa na tela de introdução/guia
            market: null,
            income: 0,
            savings: 0,
            currentDebts: {},
            downPaymentPct: 0.20,
            maxOfferPrice: 0,
            property: null,
            offer: {},
            inspectionIssues: null,
            appraisalValue: 0,
            startTime: null, 
            endTime: null, 
            finalScore: 0,
            playerName: "Jogador",
            creditScore: 700, 
            effectiveRate: 0, 
        };

        let currentListings = [];
        let houseIndex = 0; // Para simular diferentes casas na busca

        // --- UTILS ---
        const formatCurrency = (amt) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amt);
        const formatCurrencyFloat = (amt) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amt);
        
        const formatPercent = (val) => (val * 100).toFixed(2) + '%';
        const formatPercentPrecision = (val) => (val * 100).toFixed(3) + '%';
        const roundToNearest = (val, n) => Math.round(val / n) * n;

        const formatTime = (ms) => {
            if (ms < 0 || ms === null) return "0m 0s";
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}m ${seconds}s`;
        };

        const getEffectiveRate = (score) => {
            if (score >= CREDIT_RATES.excellent.min) {
                return CREDIT_RATES.excellent.rate;
            } else if (score >= CREDIT_RATES.good.min) {
                return CREDIT_RATES.good.rate;
            } else if (score >= CREDIT_RATES.fair.min) {
                return CREDIT_RATES.fair.rate;
            } else {
                return CREDIT_RATES.poor.rate;
            }
        };

        // --- LÓGICA DE CÁLCULO DE ORÇAMENTO (DTI) ---
        const calculateMaxBudget = () => {
            const marketData = MARKET_SCENARIOS[gameState.market];
            const annualRate = getEffectiveRate(gameState.creditScore);
            const monthlyRate = annualRate / 12;
            const totalPayments = 30 * 12; // Padrão de 30 anos

            // 1. Calcular a Dívida Mensal Atual (Monthly Debt)
            const totalMonthlyDebt = Object.values(gameState.currentDebts).reduce((sum, debt) => sum + debt, 0);

            // 2. Calcular o Pagamento Máximo Permitido para a Nova Hipoteca
            const maxMonthlyObligation = gameState.income * MAX_DTI;
            const maxMortgagePayment = maxMonthlyObligation - totalMonthlyDebt;

            if (maxMortgagePayment <= 0) {
                saveGameState({ maxOfferPrice: 0 });
                return 0;
            }

            // 3. Estimar componentes que variam com o preço (Taxas e Seguro)
            // Custo Mensal Estimado de Taxas e Seguro (Property Taxes + Insurance)
            const monthlyTaxInsurance = (marketData.priceRange[1] * marketData.taxRate / 12) + (INSURANCE_COST / 12);
            const maxLoanPaymentPrincipalInterest = maxMortgagePayment - monthlyTaxInsurance;

            if (maxLoanPaymentPrincipalInterest <= 0) {
                saveGameState({ maxOfferPrice: 0 });
                return 0;
            }

            // 4. Reverso da Fórmula de Hipoteca para achar o Valor Máximo do Empréstimo (L)
            const L = maxLoanPaymentPrincipalInterest * (Math.pow(1 + monthlyRate, totalPayments) - 1) / (monthlyRate * Math.pow(1 + monthlyRate, totalPayments));

            // 5. Calcular o Preço Máximo da Oferta (Loan + Down Payment)
            // Considerando o Down Payment de 20% como padrão para o cálculo inicial
            const maxPrice = L / (1 - gameState.downPaymentPct);

            // Arredonda para um valor mais realista
            const finalMaxOffer = roundToNearest(maxPrice, 5000);
            
            saveGameState({ 
                maxOfferPrice: finalMaxOffer,
                effectiveRate: annualRate
            });
            return finalMaxOffer;
        };
        
        // Calcula a parcela mensal completa (Principal, Juros, Taxas, Seguro)
        const calculateTotalMonthlyPayment = (price, downPaymentPct, appraisalValue) => {
            const marketData = MARKET_SCENARIOS[gameState.market];
            const loanAmount = Math.min(price, appraisalValue || price) * (1 - downPaymentPct);
            const annualRate = getEffectiveRate(gameState.creditScore);
            const monthlyRate = annualRate / 12;
            const totalPayments = 30 * 12;

            let PI_payment;
            if (monthlyRate === 0) {
                PI_payment = loanAmount / totalPayments;
            } else {
                PI_payment = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, totalPayments)) / (Math.pow(1 + monthlyRate, totalPayments) - 1);
            }
            
            const taxes = (price * marketData.taxRate) / 12;
            const insurance = INSURANCE_COST / 12;
            
            let pmi = 0;
            if (downPaymentPct < 0.20) {
                pmi = loanAmount * PMI_RATE / 12;
            }

            return {
                PI: PI_payment,
                Taxes: taxes,
                Insurance: insurance,
                PMI: pmi,
                Total: PI_payment + taxes + insurance + pmi
            };
        };

        // --- LÓGICA DE GERAÇÃO DE PROPRIEDADE (SIMPLIFICADA) ---
        const generateListings = (count = 3) => {
            const [min, max] = MARKET_SCENARIOS[gameState.market].priceRange;
            const listings = [];
            for (let i = 0; i < count; i++) {
                const price = roundToNearest(min + (Math.random() * (max - min)), 1000);
                const beds = Math.floor(2 + Math.random() * 3); // 2 a 4 quartos
                const baths = Math.floor(1 + Math.random() * 2); // 1 a 2 banheiros
                const size = roundToNearest(100 + Math.random() * 150, 10); // 100 a 250 m²
                
                // Variância de Avaliação (Pode ser maior ou menor que o preço de lista)
                const appraisalFactor = 0.95 + Math.random() * 0.10; // -5% a +5%
                const appraisal = roundToNearest(price * appraisalFactor, 1000);

                // Problemas de Inspeção (1 a 3 problemas) - Custo de 5k USD por problema
                const issues = Math.floor(Math.random() * 3); // 0 a 2 problemas (Ajustado)

                listings.push({ id: `H${houseIndex++}`, price, beds, baths, size, appraisal, issues });
            }
            currentListings = listings;
        };

        // --- LÓGICA DE PONTUAÇÃO ---
        const calculateScore = () => {
            if (!gameState.property || !gameState.market || !gameState.startTime || !gameState.endTime) {
                return 0;
            }

            const marketData = MARKET_SCENARIOS[gameState.market];
            const propertyPrice = gameState.property.price;
            const offerPrice = gameState.offer.price || propertyPrice;
            const timeElapsedMs = gameState.endTime - gameState.startTime;
            
            // Bônus/Penalidade por negociação
            const negotiationFactor = 1 + ((propertyPrice - offerPrice) / propertyPrice) * 0.5; 
            
            // Fator de Tempo (quanto mais rápido, maior o fator, até um máximo)
            const maxTimeFactor = 30 * 60 * 1000; // 30 minutos em ms para pontuação máxima
            const timePenaltyFactor = Math.min(2.0, maxTimeFactor / timeElapsedMs) || 1.0; 
            
            let baseScore = Math.round(propertyPrice / 1000 * negotiationFactor * timePenaltyFactor);
            baseScore *= marketData.scoreMult; // Multiplicador de mercado

            // Penalidade por Falha de Avaliação (se o jogador tiver que pagar a diferença)
            if (gameState.appraisalValue < offerPrice) {
                 const gap = offerPrice - gameState.appraisalValue;
                 // Reduz 20% do score por cada 10k de gap
                 baseScore -= (gap / 10000) * (baseScore * 0.20); 
            }
            
            const finalScore = Math.round(baseScore);

            saveGameState({ finalScore: finalScore });
            return finalScore;
        };

        // --- FIREBASE (RANKING) ---
        window.saveRanking = async (name, score, time) => {
            if (!db) return showModal("Erro de Ranking", "O serviço de ranking não está ativo. Configure o Firebase.");
            try {
                await db.collection("rankings_us").add({ 
                    name: name,
                    score: score,
                    timeMs: time,
                    market: gameState.market,
                    date: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) {
                console.error("Erro ao salvar o ranking: ", e);
                showModal("Erro de Ranking", "Não foi possível salvar sua pontuação no servidor.", "OK");
            }
        };

        window.loadRanking = async () => {
            if (!db) return window.loadRanking(); // Retorna o placeholder se o DB não estiver configurado
            try {
                const snapshot = await db.collection("rankings_us") 
                                             .orderBy("score", "desc")
                                             .limit(10)
                                             .get();
                
                const rankings = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                return rankings;
            } catch (e) {
                console.error("Erro ao carregar o ranking: ", e);
                return [];
            }
        };

        // --- CORE FUNCTIONS ---
        const getNextStage = (current) => {
            const idx = stageOrder.indexOf(current);
            return (idx !== -1 && idx < stageOrder.length - 1) ? stageOrder[idx + 1] : 'complete';
        };

        const saveGameState = (updates) => {
            gameState = { ...gameState, ...updates };
            updateUI();
        };

        const updateUI = () => {
            const mkt = gameState.market ? MARKET_SCENARIOS[gameState.market].name : 'N/A';
            const budget = gameState.maxOfferPrice > 0 ? formatCurrency(gameState.maxOfferPrice) : 'N/A';
            document.getElementById('market-display').innerText = mkt;
            document.getElementById('budget-display').innerText = budget;

            document.querySelectorAll('.board-space').forEach(el => {
                el.classList.remove('stage-active');
                if (!['ranking', 'calculator', 'social'].includes(el.id.replace('space-', ''))) {
                    el.classList.add('disabled');
                }
            });

            const currentStageIndex = stageOrder.indexOf(gameState.stage);
            
            // Ativa todas as etapas até a atual (para visualização de resumo)
            for (let i = 0; i <= currentStageIndex; i++) {
                const stageId = stageOrder[i];
                const el = document.getElementById(`space-${stageId}`);
                if (el) el.classList.remove('disabled');
            }

            if (gameState.stage !== 'complete') {
                const nextStage = getNextStage(gameState.stage);
                const nextEl = document.getElementById(`space-${nextStage}`);
                if(nextEl) {
                    nextEl.classList.remove('disabled');
                    nextEl.classList.add('stage-active'); // DESTAQUE: PRÓXIMO PASSO
                }
            } else if (gameState.stage === 'complete') {
                const finalEl = document.getElementById(`space-3-4`);
                if(finalEl) finalEl.classList.add('stage-active'); // Destaque na última etapa concluída
            }
            
            // Botões de ranking, calculadora e social sempre ativos
            document.getElementById('space-ranking').classList.remove('disabled');
            document.getElementById('space-calculator').classList.remove('disabled');
            document.getElementById('space-social').classList.remove('disabled');
            
            if (gameState.stage === 'intro') {
                renderCenterContent('intro');
            }
        };

        window.handleSpaceClick = (id) => {
            if (!document.getElementById(`space-${id}`).classList.contains('disabled')) {
                renderCenterContent(id);
            }
        };

        window.selectMarket = (marketKey) => {
            const mkt = MARKET_SCENARIOS[marketKey];
            saveGameState({ 
                market: marketKey,
                income: mkt.startIncome,
                savings: mkt.startSavings,
                currentDebts: mkt.startDebts,
                stage: '1-1',
                startTime: Date.now() 
            });
            renderCenterContent('1-1');
            showModal("Mercado Selecionado", `Bem-vindo ao mercado **${mkt.name}**! Seus dados iniciais foram carregados. Prossiga para a auditoria financeira.`, "OK");
        };

        window.advanceStage = (updates = {}) => {
            const next = getNextStage(gameState.stage);
            saveGameState({ stage: next, ...updates });
            renderCenterContent(next);
        };
        
        window.resetGame = () => {
            location.reload();
        };
        
        window.submitScore = () => {
            const name = document.getElementById('player-name').value;
            if (name.trim()) {
                saveRanking(name, gameState.finalScore, gameState.endTime - gameState.startTime);
                showModal("Sucesso!", "Sua pontuação foi enviada para o Ranking!", "OK");
                document.getElementById('player-name').disabled = true;
            } else {
                showModal("Atenção", "Por favor, insira um nome para o Ranking.", "OK");
            }
        };

        // --- FUNÇÕES DE SALVAMENTO DE DADOS E AVANÇO ---

        window.saveIncomeData = () => {
            const newIncome = parseFloat(document.getElementById('input-income').value);
            const newSavings = parseFloat(document.getElementById('input-savings').value);
            const newCreditScore = parseFloat(document.getElementById('input-credit-score').value);
            
            if (isNaN(newIncome) || isNaN(newSavings) || isNaN(newCreditScore) || newIncome <= 0 || newCreditScore < 300) {
                showModal("Atenção", "Por favor, preencha todos os campos com valores válidos (Renda > 0 e Score > 300).", "OK");
                return;
            }

            saveGameState({ 
                income: newIncome, 
                savings: newSavings,
                creditScore: newCreditScore
            });

            advanceStage();
        };

        window.saveDebtData = () => {
            let newDebts = {};
            let totalMonthlyDebt = 0;
            document.querySelectorAll('.debt-input').forEach(input => {
                const value = parseFloat(input.value) || 0;
                newDebts[input.name] = value;
                totalMonthlyDebt += value;
            });

            saveGameState({ currentDebts: newDebts });
            
            calculateMaxBudget();

            showModal("Orçamento Calculado", 
                `Suas dívidas mensais somam **${formatCurrency(totalMonthlyDebt)}**. Seu **Orçamento Máximo** para o imóvel foi definido.`, 
                "OK"
            );
            
            advanceStage();
        };

        window.saveDownPaymentData = () => {
            const dpPct = parseFloat(document.getElementById('input-down-payment-pct').value) / 100;
            const newPct = Math.max(0.03, Math.min(1.0, dpPct)); 
            
            if (isNaN(dpPct)) {
                showModal("Atenção", "Insira um valor de percentual de entrada válido.", "OK");
                return;
            }
            
            saveGameState({ downPaymentPct: newPct });
            
            calculateMaxBudget();

            showModal("Entrada Definida", 
                `Você definiu uma entrada de **${formatPercent(newPct)}**.`, 
                "OK"
            );
            
            advanceStage();
        };

        window.simulatePreApproval = () => {
            const maxBudget = gameState.maxOfferPrice;
            const totalMonthlyDebt = Object.values(gameState.currentDebts).reduce((sum, debt) => sum + debt, 0);
            const dti = totalMonthlyDebt / gameState.income;
            
            if (maxBudget > 0) {
                 showModal("Pré-Aprovação Recebida", 
                    `Parabéns! Você foi pré-aprovado. Seu limite máximo de compra é de **${formatCurrency(maxBudget)}**.`, 
                    "OK"
                );
            } else {
                 showModal("Pré-Aprovação Negada", 
                    `Sua relação Dívida/Renda (**${dti.toFixed(2)}**) está acima do limite de **${MAX_DTI}**.`, 
                    "OK"
                );
            }
            
            generateListings();
            advanceStage(); 
        };
        
        window.selectProperty = (listingId) => {
            const property = currentListings.find(l => l.id === listingId);
            
            if (!property) return;
            
            if (property.price > gameState.maxOfferPrice) {
                showModal("Atenção - Orçamento Excedido",
                    `O preço de lista excede seu orçamento máximo de **${formatCurrency(gameState.maxOfferPrice)}**. Prossiga com cautela!`,
                    "OK"
                );
            } else {
                 showModal("Imóvel Selecionado",
                    `Imóvel **${property.id}** selecionado. Próximo passo: Fazer uma Oferta!`,
                    "OK"
                );
            }
            
            saveGameState({ property: property, offer: {} });
            advanceStage({ stage: '2-4' }); 
        };

        window.submitOffer = () => {
            const offerPrice = parseFloat(document.getElementById('input-offer-price').value);
            const propertyPrice = gameState.property.price;
            
            if (isNaN(offerPrice) || offerPrice <= 0) {
                 showModal("Atenção", "Insira um valor de oferta válido.", "OK");
                 return;
            }
            
            let statusMessage;
            
            // Simulação de negociação
            const accepted = offerPrice >= propertyPrice * 0.95 && offerPrice <= gameState.maxOfferPrice * 1.05; 
            
            if (offerPrice < propertyPrice * 0.9) {
                 statusMessage = "A oferta foi muito baixa e foi **rejeitada** imediatamente.";
                 showModal("Oferta Rejeitada", statusMessage, "OK");
                 return; 
            }
            
            if (accepted) {
                statusMessage = `Parabéns! Sua oferta de **${formatCurrency(offerPrice)}** foi aceita! Estamos sob contrato.`;
                saveGameState({ offer: { price: offerPrice }, appraisalValue: gameState.property.appraisal }); 
                advanceStage();
            } else {
                statusMessage = `Sua oferta de **${formatCurrency(offerPrice)}** foi rejeitada. Tente fazer uma oferta mais alta.`;
                showModal("Oferta Rejeitada", statusMessage, "OK");
            }
        };

        window.negotiateInspection = () => {
             const issues = gameState.property.issues;
             const offerPrice = gameState.offer.price;
             const negotiationInput = parseFloat(document.getElementById('input-inspection-negotiation').value) || 0;
             
             if (issues === 0) {
                 showModal("Inspeção Limpa", "A inspeção não encontrou problemas. Avance para a Avaliação.", "OK");
                 advanceStage();
                 return;
             }

             if (negotiationInput > 0) {
                 const maxDiscount = (issues * 5000); 
                 const acceptedDiscount = Math.min(negotiationInput * 0.7, maxDiscount); 
                 
                 const newOfferPrice = offerPrice - acceptedDiscount;

                 showModal("Negociação Concluída", 
                    `Problemas (${issues}) encontrados. Desconto negociado: **${formatCurrency(acceptedDiscount)}**. Novo preço de contrato: **${formatCurrency(newOfferPrice)}**.`, 
                    "OK"
                );
                
                 saveGameState({ offer: { price: newOfferPrice } });
                 advanceStage();

             } else {
                 showModal("Atenção", `A inspeção encontrou **${issues}** problemas. Você deve negociar um desconto ou aceitar o imóvel como está.`, "OK");
             }
        };

        window.simulateAppraisal = () => {
            const appraisalValue = gameState.property.appraisal;
            const offerPrice = gameState.offer.price;
            
            let message;
            if (appraisalValue >= offerPrice) {
                message = `Excelente! O imóvel foi avaliado em **${formatCurrency(appraisalValue)}**, cobrindo seu preço de contrato.`;
            } else {
                const gap = offerPrice - appraisalValue;
                message = `Atenção! Avaliação de **${formatCurrency(appraisalValue)}** está **${formatCurrency(gap)}** abaixo do contrato. Você precisa cobrir essa diferença em dinheiro.`;
            }
            
            showModal("Avaliação Bancária", message, "OK");
            saveGameState({ appraisalValue: appraisalValue });
            advanceStage();
        };

        window.completeClosing = () => {
            const offerPrice = gameState.offer.price;
            const downPayment = offerPrice * gameState.downPaymentPct;
            
            const loanAmountMax = offerPrice - downPayment;
            const loanAmountFinal = Math.min(loanAmountMax, gameState.appraisalValue - downPayment); 

            let message = `Parabéns! O processo de fechamento foi concluído.
            <ul class="list-disc list-inside text-left mt-3 space-y-1">
                <li>Preço Final: **${formatCurrency(offerPrice)}**</li>
                <li>Empréstimo (Hipoteca): **${formatCurrency(loanAmountFinal)}**</li>
            </ul>
            <p class="mt-3">Você venceu a fase de Fechamento!</p>`;
            
            showModal("Fechamento Concluído", message, "OK");
            advanceStage();
        };
        
        window.getFinalScore = () => {
            saveGameState({ endTime: Date.now() });
            calculateScore();
            renderCenterContent('complete');
        };


        // --- Funções Modal ---
        window.showModal = (title, body, buttonText = "Fechar") => {
            document.getElementById('modal-title').innerHTML = `<i class="ph ph-info text-2xl mr-2"></i> ${title}`;
            document.getElementById('modal-body').innerHTML = `<p class="text-base text-gray-700">${body}</p>`;
            document.getElementById('modal-footer').querySelector('.btn-primary').innerText = buttonText;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        };

            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        };

                case '1-3': // Entrada
                    html = `

                                    <div>
                                        <div class="font-bold text-white text-lg">${formatCurrency(l.price)}</div>

                                    </div>
                                </div>
                            `).join('')}
                        </div>
                         <button onclick="advanceStage({ stage: '2-3' })" class="btn-secondary mt-6">
                            <i class="ph ph-house-line text-xl mr-2"></i> Voltar para Selecionar
                        </button>
                    `;
                    break;

                case '2-3': // Selecionar (Redireciona para a lista)
                    html = `
                         <h3 class="text-2xl font-bold text-secondary mb-4"><i class="ph ph-house-line text-2xl mr-2"></i> Selecionar Imóvel</h3>

                    if (!gameState.property) {
                        html = `<p class="text-red-400">Nenhum imóvel selecionado. Volte para a busca.</p><button onclick="advanceStage({ stage: '2-1' })" class="btn-primary mt-6">Buscar</button>`;

                        </button>
                    `;

                case '3-1': // Inspeção
                    const prop = gameState.property;
                    const issues = prop ? prop.issues : 0;
                    const message = issues > 0 
                        ? `<p class="text-red-400 font-bold">Atenção: Inspeção encontrou **${issues}** problemas. Negocie um desconto.</p>`
                        : `<p class="text-green-400 font-bold">Ótimo! Inspeção limpa.</p>`;

                        <h3 class="text-2xl font-bold text-zone-3 mb-4"><i class="ph ph-file-pdf text-2xl mr-2"></i> Fechamento do Contrato (Closing)</h3>
                        <p class="text-gray-400 mb-6">Todos os documentos foram assinados.</p>
                        <div class="text-left w-full max-w-md bg-gray-700 p-4 rounded-lg shadow-inner">
                            <p>Preço Final: **${formatCurrency(gameState.offer.price)}**</p>
                            <p>Próxima Ação: Receber as Chaves!</p>
                        </div>
                        <button onclick="completeClosing()" class="btn-primary mt-6">
                            <i class="ph ph-key text-xl mr-2"></i> Concluir Fechamento
                        </button>
                    `;
                    break;

                case '3-4': // Chaves!
                    html = `
                        <h3 class="text-2xl font-bold text-zone-3 mb-4"><i class="ph ph-key text-3xl mr-2 text-accent"></i> Parabéns! Você comprou o imóvel!</h3>
                        <p class="text-gray-400 mb-6">O processo de compra foi concluído. Veja sua pontuação final.</p>
                        <button onclick="getFinalScore()" class="btn-primary mt-6">
                            <i class="ph ph-trophy text-xl mr-2"></i> Ver Pontuação Final
                        </button>
                    `;
                    break;

                case 'complete': // FIM DE JOGO
                    html = `
                        <h3 class="text-3xl font-black text-accent mb-4">🥳 JOGO COMPLETO!</h3>
                        <p class="text-gray-400 mb-2">Tempo Total: **${formatTime(gameState.endTime - gameState.startTime)}**</p>
                        <p class="text-5xl font-extrabold text-white my-4">Score Final: ${formatCurrency(gameState.finalScore)}</p>

                        <div class="w-full max-w-sm space-y-3 text-left">
                             <label class="label-text">Seu Nome para o Ranking</label>
                            <input type="text" id="player-name" class="input-field" value="${gameState.playerName}" placeholder="Nome do Jogador">
                        </div>
                        <button onclick="submitScore()" class="btn-primary mt-4">
                            <i class="ph ph-upload text-xl mr-2"></i> Enviar Pontuação
                        </button>
                         <button onclick="resetGame()" class="btn-secondary mt-4">
                            <i class="ph ph-flag-checkered text-xl mr-2"></i> Iniciar Novo Jogo
                        </button>
                    `;
                    break;
                    
                case 'ranking':
                    html = `
                         <h3 class="text-xl font-bold mb-4"><i class="ph ph-trophy text-2xl mr-2"></i> Melhores Corretores (US/MA)</h3>
                         <div id="ranking-list-container" class="w-full text-left text-gray-400">Carregando ranking...</div>
                     `;
                     content.innerHTML = html;
                     const rankings = await loadRanking();
                     const listContainer = document.getElementById('ranking-list-container');
                     
                     if (Array.isArray(rankings) && rankings.length === 0) {
                         listContainer.innerHTML = '<p class="text-gray-400">Nenhum score encontrado. Jogue e seja o primeiro!</p>';
                     } else {
                         listContainer.innerHTML = `
                             <div class="ranking-list">
                                 ${rankings.map((r, index) => `
                                     <div class="ranking-item ${index === 0 ? 'bg-accent text-gray-900 font-extrabold' : ''}">
                                         <span class="w-1/6">${index + 1}°</span>
                                         <span class="w-3/6">${r.name}</span>
                                         <span class="w-2/6 text-right">${formatCurrency(r.score)}</span>
                                     </div>
                                 `).join('')}
                             </div>
                         `;
                     }
                     return;

                case 'calculator': 
                     const currentRate = getEffectiveRate(gameState.creditScore);
                     html = `
                         <h3 class="text-xl font-bold mb-4"><i class="ph ph-calculator text-2xl mr-2"></i> Calculadora de Prestação (P&I)</h3>
                         <p class="text-sm text-gray-400 mb-4">Sua Taxa Estimada: <span class="text-accent font-bold">${formatPercentPrecision(currentRate)}</span></p>

                         <div class="w-full space-y-3 max-w-sm">
                             <label class="label-text">Valor do Empréstimo ($)</label>
                             <input type="number" id="calc-loan" class="input-field" value="300000" oninput="calculateMortgage()">
                         </div>

                         <div id="calc-result" class="mt-4 p-4 bg-gray-700 rounded-lg w-full max-w-sm font-bold text-lg hidden">
                             Prestação Mensal P&I: <span class="text-accent" id="monthly-payment-display">R$ 0</span>
                         </div>
                     `;
                      window.calculateMortgage = () => {
                          const loan = parseFloat(document.getElementById('calc-loan').value);
                          const annualRatePct = parseFloat(document.getElementById('calc-rate')?.value || (currentRate * 100).toFixed(3)) / 100;
                          const termYears = parseFloat(document.getElementById('calc-term')?.value || 30);

                          if (isNaN(loan) || loan <= 0) {
                              document.getElementById('calc-result').classList.add('hidden');
                              return;
                          }

                          const monthlyRate = annualRatePct / 12;
                          const totalPayments = termYears * 12;

                          let monthlyPayment;
                          if (monthlyRate === 0) {
                              monthlyPayment = loan / totalPayments;
                          } else {
                              monthlyPayment = loan * (monthlyRate * Math.pow(1 + monthlyRate, totalPayments)) / (Math.pow(1 + monthlyRate, totalPayments) - 1);
                          }
                          
                          document.getElementById('monthly-payment-display').innerText = formatCurrency(monthlyPayment);
                          document.getElementById('calc-result').classList.remove('hidden');
                      };
                     setTimeout(() => calculateMortgage(), 100);
                     break;
                    
                case 'social':
                    const socialLinks = [
                        { name: "Website Oficial", icon: "ph-globe-simple", url: "https://www.cristianojarbas.com/" },
                        { name: "Instagram", icon: "ph-instagram-logo", url: "https://www.instagram.com/cristianojarbas" },
                        { name: "YouTube", icon: "ph-youtube-logo", url: "https://www.youtube.com/@cristianojarbas" },
                        { name: "LinkedIn", icon: "ph-linkedin-logo", url: "https://www.linkedin.com/in/cristianojarbas" }
                    ];

                    html = `
                        <h3 class="text-xl font-bold mb-4"><i class="ph ph-share-network text-2xl mr-2"></i> Redes Sociais</h3>
                        <p class="text-gray-400 mb-6">Conheça mais sobre os criadores e o conceito.</p>
                        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
                             ${socialLinks.map(link => `
                                <a href="${link.url}" target="_blank" class="bg-gray-800 p-4 rounded-xl hover:bg-gray-700 border border-gray-600 text-center flex flex-col items-center">
                                    <i class="ph ${link.icon} text-3xl mb-2 text-accent"></i>
                                    <span class="font-bold text-sm">${link.name}</span>
                                </a>
                            `).join('')}
                        </div>
                    `;
                    break;

                default:
                    html = `
                         <h2 class="text-3xl font-black text-primary mb-4">Cristiano Jarbas Tycoon</h2>
                         <p class="text-gray-400 mb-6">Siga o passo a passo no tabuleiro. A próxima etapa é indicada pelo destaque **Azul**.</p>
                         <i class="ph ph-arrow-down-left text-8xl text-secondary animate-bounce"></i>
                    `;
            }

            content.innerHTML = html;
        };

        document.addEventListener('DOMContentLoaded', () => {
             updateUI();
             renderCenterContent('intro');
        });
    </script>
</body>
</html>
